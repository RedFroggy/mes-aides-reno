name: Deploy library to registry

on:
  workflow_dispatch:
    inputs:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0 # >= 22.18 required for native TypeScript type stripping
          registry-url: 'https://npm.pkg.github.com'
          scope: '@redfroggy'

      - name: Git checkout for source code analysis
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install --force --legacy-peer-deps

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build publicodes model
        if: github.ref == 'refs/heads/main'
        run: npm run build:publicodes

      - name: Release library to private registry
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i '0,/{/s/{/{\n  "type": "module",/' package.json
          npm publish
