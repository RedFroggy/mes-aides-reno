name: Deploy library to registry

on:
  workflow_dispatch:
    inputs:

permissions:
  contents: read
  packages: write

env:
  NEXT_PUBLIC_COMMIT_ID: ${{ github.sha }}
  MAIR_DG_ORT_PAGE_URL: 'https://www.data.gouv.fr/datasets/liste-des-communes-couvertes-par-des-operations-de-revitalisation-de-territoire'
  MAIR_DG_ORT_DATA_URL: 'https://www.data.gouv.fr/api/1/datasets/r/17a6bc80-297a-4dc2-b98c-3edc12161bc0'
  MAIR_DG_COEUR_VILLE_PAGE_URL: 'https://www.data.gouv.fr/datasets/listes-des-villes-action-coeur-de-ville'
  MAIR_DG_COEUR_VILLE_DATA_URL: 'https://www.data.gouv.fr/api/1/datasets/r/97d44c4a-fbf4-4545-8940-ea3a51aa821a'

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          registry-url: 'https://npm.pkg.github.com'
          scope: '@redfroggy'

      - name: Git checkout for source code analysis
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install --force --legacy-peer-deps

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build library
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          npm run build

      - name: Release library to private registry
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i '0,/{/s/{/{\n  "type": "module",/' package.json
          npm publish
